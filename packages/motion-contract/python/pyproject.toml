[project]
name = "motion-contract"
version = "1.0.0"
description = "MotionResult v1 pydantic models, validator, and fixtures."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motion_contract"]
