[project]
name = "beat-detect"
version = "0.1.0"
description = "Automatic beat/downbeat proposal for a clip's audio. Not UI. Manual tap-in always wins (see README)."
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beat_detect"]
