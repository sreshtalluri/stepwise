[project]
name = "beat-detect"
version = "0.1.0"
description = "Automatic beat/downbeat proposal for a clip's audio. Not UI. Manual tap-in always wins (see README)."
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg==0.6.0",  # pinned ffmpeg 7.x; see _extract_audio
    "librosa>=0.10",
    "numpy>=1.26",
    # Beat This! (MIT code and weights). CPU-only torch: no GPU on this path.
    "beat-this==1.1.0",
    "torch>=2",
    "torchaudio",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "soundfile>=0.12",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beat_detect"]
