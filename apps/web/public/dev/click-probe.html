<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Click timing probe · stepwise</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F2EFE9; color: #221E1C;
         font: 18px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  button { font: 700 20px system-ui; background: #F2891D; border: 0; border-radius: 999px; padding: 16px 28px; }
  .big { font: 800 64px system-ui; margin: 8px 0; }
  .small { color: rgba(34,30,28,.6); font-size: 14px; }
  video { display: none; }
</style>
</head>
<body>
<main id="m">
  <p>Measures how late stepwise's click sounds against the music on this device,<br>by listening with the microphone. Volume up, quiet room, phone face up.</p>
  <button id="go">Run (about 12 s)</button>
</main>
<script>
/*
 * The test video has a 4 ms 2 kHz blip every 0.5 s of media time, from 1 s. It plays
 * the normal way (the <video>'s own audio path). Alongside, Web Audio books a 700 Hz
 * click 100 ms after every blip, the way hooks.ts `useMetronome` books clicks: from
 * video.currentTime, with NO lead. The microphone hears both. Split by pitch (two
 * band-pass filters), each blip-to-click gap minus 100 ms is how late the click path
 * is: the lead hooks.ts `clickLeadS` needs. Mic delay hits both sounds equally.
 */
const GAP = 0.1;

document.getElementById("go").onclick = async () => {
  const m = document.getElementById("m");
  m.innerHTML = "<p>Listening… keep quiet for 12 s.</p>";
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const v = document.createElement("video");
    v.src = "click-probe.mp4"; v.playsInline = true;
    document.body.append(v);
    const playing = v.play();  // inside the tap, for iOS
    await ctx.resume();
    const mic = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    await playing;
    v.pause(); v.currentTime = 0;

    // Mic -> two band-passes -> one stereo ScriptProcessor that timestamps envelopes.
    const src = ctx.createMediaStreamSource(mic);
    const merge = ctx.createChannelMerger(2);
    for (const [hz, ch] of [[2000, 0], [700, 1]]) {
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = hz; bp.Q.value = 8;
      src.connect(bp).connect(merge, 0, ch);
    }
    const sp = ctx.createScriptProcessor(256, 2, 1);
    const env = [[], []];  // [time, level] per 256-sample block, per band
    sp.onaudioprocess = (e) => {
      for (const ch of [0, 1]) {
        const x = e.inputBuffer.getChannelData(ch);
        let peak = 0, at = 0;
        for (let i = 0; i < x.length; i++) if (Math.abs(x[i]) > peak) { peak = Math.abs(x[i]); at = i; }
        env[ch].push([e.playbackTime + at / ctx.sampleRate, peak]);
      }
    };
    const sink = ctx.createGain(); sink.gain.value = 0;
    merge.connect(sp).connect(sink).connect(ctx.destination);

    // The clicks, booked from the video clock exactly as the app does (no lead).
    let booked = -1;
    const tick = setInterval(() => {
      if (v.paused) return;
      const t = v.currentTime;
      for (let k = Math.max(0, Math.ceil((t - 1 - GAP) / 0.5)); ; k++) {
        const media = 1 + k * 0.5 + GAP;
        if (media - t > 0.15) break;
        if (k <= booked) continue;
        const when = ctx.currentTime + Math.max(0, media - t);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 700;
        g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + 0.002);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.03);
        o.connect(g).connect(ctx.destination); o.start(when); o.stop(when + 0.04);
        booked = k;
      }
    }, 25);
    await v.play();
    await new Promise((r) => setTimeout(r, 11000));
    clearInterval(tick); v.pause(); mic.getTracks().forEach((t) => t.stop());

    // Onsets: blocks above 40% of that band's loudest, at least 300 ms apart.
    const onsets = (e) => {
      const max = Math.max(...e.map((b) => b[1]));
      const out = [];
      for (const [t, lvl] of e) if (lvl > 0.4 * max && (!out.length || t - out[out.length - 1] > 0.3)) out.push(t);
      return out;
    };
    const blips = onsets(env[0]), clicks = onsets(env[1]);
    const lates = blips.map((b) => {
      const c = clicks.find((c) => c > b - 0.2 && c < b + 0.45);
      return c === undefined ? null : (c - b - GAP) * 1000;
    }).filter((x) => x !== null).sort((a, b) => a - b);
    if (lates.length < 6) throw new Error(`only heard ${blips.length} beeps and ${clicks.length} clicks (mic peak ${Math.max(0, ...env[0].map((b) => b[1])).toFixed(4)} / ${Math.max(0, ...env[1].map((b) => b[1])).toFixed(4)}, ${env[0].length} blocks); turn the volume up`);
    const lead = Math.round(lates[lates.length >> 1]);
    const spread = Math.round(lates[Math.floor(lates.length * 0.9)] - lates[Math.floor(lates.length * 0.1)]);
    m.innerHTML = `<p>The click sounds this late on this device</p><div class="big">${lead} ms</div>
      <p>Send this number to Claude.</p>
      <p class="small">${lates.length} pairs, spread ${spread} ms · ${navigator.userAgent}</p>`;
  } catch (e) {
    m.innerHTML = `<p>Couldn't measure: ${e.message || e}</p>`;
  }
};
</script>
</body>
</html>
